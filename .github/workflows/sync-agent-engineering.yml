name: Sync agent-engineering standards

# Daily: copy agent-engineering's standards into vendor/ and open (or update) one PR.
# A maintainer reviews and merges; nothing reaches main without review.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-agent-engineering
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent-engineering-sync
    steps:
      - uses: actions/checkout@v4

      - name: Sync from upstream
        run: bash tooling/sync-agent-engineering.sh

      - name: Stop when nothing changed
        id: diff
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # PRs opened with the workflow token do not trigger CI, so verify here.
      - name: Verify
        if: steps.diff.outputs.changed == 'true'
        run: make verify

      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "Sync agent-engineering standards" -m "$(cat vendor/agent-engineering.lock)"
          git push -q --force origin "$BRANCH"
          # Pushes and PRs made with the workflow token start no workflows; dispatch CI so the required checks report.
          gh workflow run ci.yml --ref "$BRANCH" -f xcode=false
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Sync agent-engineering standards" \
              --body "$(printf 'Automated sync by `.github/workflows/sync-agent-engineering.yml`. `make verify` passed in the workflow run.\n\nPinned commit:\n\n```\n%s\n```\n\nReview the diff before merging: these files are agent instructions. Check that the Apple rules in `PRINCIPLES.md` and `core/` still specialize them rather than contradict them.' "$(cat vendor/agent-engineering.lock)")"
          fi
